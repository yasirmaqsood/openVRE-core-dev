apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduler-ingress
  labels:
    app.kubernetes.io/part-of: bsc-tre
spec:
  podSelector:
    matchLabels:
      app: scheduler
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: dashboard-frontend
    ports:
    - protocol: TCP
      port: 8080
