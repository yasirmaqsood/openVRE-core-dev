apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-sgecore
  labels:
    app.kubernetes.io/part-of: bsc-tre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-sgecore
  template:
    metadata:
      labels:
        app: dashboard-sgecore
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: dashboard-init-create-shared-folders
        image: busybox:1.36
        command:
        - sh
        - -c
        - 'mkdir -p /shared_data/public /shared_data/userdata

          chmod -R 0777 /shared_data/public /shared_data/userdata || true

          '
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: frontend-sgecore-shareddata
          mountPath: /shared_data
      containers:
      - name: dashboard-sgecore
        image: docker.io/ymaqsoodbsc/openvre-kubernetes:sgecore-1.0
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 6444
        command:
        - /bin/bash
        - -c
        - 'groupmod -g $DOCKER_GROUP docker \

          && usermod -aG docker application \

          && echo "$SUBMITTER_HOSTNAME" > /home/application/submit_hosts.list \

          && /entrypoint.sh

          '
        env:
        - name: DOCKER_GROUP
          value: '1002'
        envFrom:
        - configMapRef:
            name: dashboard-sgecore-env
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: frontend-sgecore-shareddata
          mountPath: /shared_data
      volumes:
      - name: frontend-sgecore-shareddata
        persistentVolumeClaim:
          claimName: dashboard-frontend-sgecore-shareddata
