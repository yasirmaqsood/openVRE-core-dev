    ;\n$GLOBALS['tool_dev_sample'] = $GLOBALS['root'].\"/install/data/tool_schemas/tool_specification/examples/example.json\"\
    ;\n$GLOBALS['tool_io_dev_sample'] = $GLOBALS['root'].\"/install/data/tool_schemas/tool_specification/examples/example_io.json\"\
    ;\n$GLOBALS['compressions'] = array(\n    \"zip\"=>\"ZIP\",\"bz2\"=>\"BZIP2\"\
    ,\"gz\"=>\"GZIP\",\"tgz\"=>\"TAR,GZIP\",\"tar.gz\"=>\"TAR,GZIP\",\n    \"tbz2\"\
    =>\"TAR,BZIP2\",\"tar.bz2\"=>\"TAR,BZIP2\",\"tar.Z\"=>\"TAR,ZIP\",\"rar\"=>\"\
    RAR\",\"tar\"=>\"TAR\"\n);\n$GLOBALS['placeholder_input'] = \"Click right button\
    \ to select file\";\n$GLOBALS['placeholder_textarea'] = \"Click right button to\
    \ select file(s)\";\n$GLOBALS['cloud'] = \"local\";\n$GLOBALS['clouds'] = array(\n\
    \    \"local\" => array(\n        \"http_host\" => \"localhost\",\n        \"\
    dataDir_fs\" => \"/shared_data/userdata/\",\n        \"pubDir_fs\" => \"/shared_data/public/\"\
    ,\n        \"dataDir_virtual\" => $GLOBALS['dataDir'],\n        \"pubDir_virtual\"\
    \ => $GLOBALS['pubDir'],\n        \"dataDir_host\" => getenv('FRONTEND_HOST_PATH').$GLOBALS['dataDir'],\n\
    \        \"pubDir_host\" => getenv('FRONTEND_HOST_PATH').$GLOBALS['pubDir'],\n\
    \        \"scriptsDir_host\" => getenv('FRONTEND_HOST_PATH').$GLOBALS['shared'].\"\
    scripts/\",\n        \"PMESserver_domain\" => \"localhost\",\n        \"PMESserver_port\"\
    \ => \"80\",\n        \"PMESserver_address\" => \"/\",\n        \"imageTypes\"\
