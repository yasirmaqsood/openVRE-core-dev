    \ = $GLOBALS['shared'].\"userdata/\";\n$GLOBALS['pubDir'] = $GLOBALS['shared'].\"\
    public/\";\n$GLOBALS['sampleDataPath'] = \"/var/www/html/openVRE/data/sampleData/\"\
