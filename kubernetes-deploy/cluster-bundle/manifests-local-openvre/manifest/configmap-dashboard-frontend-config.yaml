    \ = \".results.json\";\n$GLOBALS['tool_metadata_file'] = \".input_metadata.json\"\
    ;\n$GLOBALS['timezone'] = \"UTC\";\n$GLOBALS['datetime'] = \"Y.M.dd HH:mm\";\n\
    $GLOBALS['logs_datetime'] = \"dd.M.Y HH:mm:ss\";\n$GLOBALS['vaultUrl'] = getenv('VAULT_ADDR')\
    \ . \"/\" . getenv('VAULT_API_VERSION');\n$GLOBALS['vaultRolename'] = getenv('VAULT_ROLENAME');\n\
    $GLOBALS['secretPath'] = getenv('VAULT_SECRET_PATH');\n"
