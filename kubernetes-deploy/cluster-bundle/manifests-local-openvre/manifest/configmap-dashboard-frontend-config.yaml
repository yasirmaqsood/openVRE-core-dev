    $GLOBALS['urlAccessToken'] = $authServerInternal.'/realms/'.$GLOBALS['authRealm'].'/protocol/openid-connect/token';\n\
    $GLOBALS['urlResourceOwnerDetails'] = $authServerInternal.'/realms/'.$GLOBALS['authRealm'].'/protocol/openid-connect/userinfo';\n\
    $GLOBALS['urlLogout'] = $authServerPublic.'/realms/'.$GLOBALS['authRealm'].'/protocol/openid-connect/logout';\n\
    $GLOBALS['adminToken'] = $authServerInternal.\"/realms/master/protocol/openid-connect/token\"\
    ;\n$GLOBALS['adminRealm'] = $authServerInternal.\"/admin/realms/\".$GLOBALS['authRealm'];\n\
    $GLOBALS['URL'] = $scheme . \"://\" . $host . $GLOBALS['BASEURL'];\n$GLOBALS['URL_login']\
    \ = $GLOBALS['URL'].\"login.php\";\n$GLOBALS['htmlPath'] = $GLOBALS['root'].\"\
    /public/\";\n$GLOBALS['htmlib'] = $GLOBALS['htmlPath'].\"htmlib\";\n$GLOBALS['appsDir']\
