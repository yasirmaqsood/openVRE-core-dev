    $GLOBALS['ADMIN'] = array(0);\n$GLOBALS['TOOLDEV'] = array(1);\n$GLOBALS['ROLES_COLOR']\
    \ = array(\"0\"=>\"blue\",\"1\"=>\"grey-cascade\",\"2\"=>\"\",100=>\"red-haze\"\
    ,101=>\"yellow-haze\");\n$GLOBALS['STATES_COLOR'] = array(\"0\"=>\"font-red\"\
    ,\"1\"=>\"font-green-meadow\",\"2\"=>\"font-blue-steel\",3=>\"font-green-meadow\"\
    ,4=>\"font-yellow-mint\");\n$GLOBALS['FILE_MSG_COLOR'] = array(\"0\"=>\"note-danger\"\
    ,\"1\"=>\"note-info\",\"2\"=>\"note-success\",3=>\"note-info\");\n$scheme = \"\
