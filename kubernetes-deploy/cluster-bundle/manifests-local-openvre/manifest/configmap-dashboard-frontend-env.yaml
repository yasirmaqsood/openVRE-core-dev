apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-frontend-env
  labels:
    app.kubernetes.io/part-of: bsc-tre
data:
  FRONTEND_HOST_PATH: ''
  KEYCLOAK_CLIENT: openvre
  KEYCLOAK_SERVER: http://dashboard-keycloak.bsctre-v2.svc.cluster.local:8080/auth
  MAIL_HOST: ''
  MAIL_USER: ''
  MONGO_SERVER: dashboard-mongodb.bsctre-v2.svc.cluster.local:27017
  SERVER_DOMAIN: ''
  VAULT_ADDR: http://dashboard-vault.bsctre-v2.svc.cluster.local:8200
  VAULT_API_VERSION: v1
  VAULT_ROLENAME: user-role
  VAULT_SECRET_PATH: secret/data/
  OPENVRE_K8S_SCHEDULER_URL: http://scheduler.bsctre-v2.svc.cluster.local:8080
  OPENVRE_K8S_SCHEDULER_TOKEN: dev-scheduler-token
  OPENVRE_K8S_NAMESPACE: bsctre-v2
  OPENVRE_K8S_SHARED_PVC: dashboard-frontend-sgecore-shareddata
  OPENVRE_K8S_TOOLS_PVC: dashboard-frontend-tools
  OPENVRE_K8S_RUN_AS_UID: '1000'
  OPENVRE_K8S_RUN_AS_GID: '1000'
  OPENVRE_K8S_JOB_IMAGE: ymaqsoodbsc/fem-tool-2-updated:1.0
  OPENVRE_K8S_JOB_TTL: '120'
  OPENVRE_K8S_JOB_DEADLINE: '86400'
