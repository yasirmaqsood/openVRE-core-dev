# Source: bsc-tre/templates/frontend.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-frontend-apache-conf
  labels:
    app.kubernetes.io/part-of: bsc-tre
data:
  server.conf: |
    <VirtualHost *:80>
        ServerName localhost
        DocumentRoot /var/www/html/openVRE/public/
        DirectoryIndex index.php
        <Directory "/var/www/html/openVRE/public/api">
            AllowOverride All
            Require all granted
        </Directory>
        ProxyPass "/auth" "http://dashboard-keycloak.bsctre-v2.svc.cluster.local:8080/auth"
        ProxyPassReverse "/auth" "http://dashboard-keycloak.bsctre-v2.svc.cluster.local:8080/auth"
        RewriteEngine on
        RewriteRule ^/interactive-tool/([^/]+)/?(.*) https://$1:8090/$2 [P,L]
        ErrorLog /var/log/apache/vre-error.log
