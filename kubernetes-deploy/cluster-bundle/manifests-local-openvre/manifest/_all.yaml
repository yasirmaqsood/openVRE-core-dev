              value: "mongo_user"
            - name: MONGO_INITDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-mongodb-password
                  key: MONGO_INITDB_PASSWORD
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
