apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-keycloak-env
  labels:
    app.kubernetes.io/part-of: bsc-tre
data:
  DB_VENDOR: POSTGRES
  DB_ADDR: dashboard-postgres.bsctre-v2.svc.cluster.local:5432
  DB_SCHEMA: public
  KEYCLOAK_USER: admin
  PROXY_ADDRESS_FORWARDING: 'false'
  KEYCLOAK_FRONTEND_URL: http:///auth
  KEYCLOAK_REALM: master
