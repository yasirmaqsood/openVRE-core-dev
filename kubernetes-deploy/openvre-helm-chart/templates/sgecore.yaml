{{- if .Values.components.sgecore.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-sgecore-env
  labels:
    app.kubernetes.io/part-of: bsc-tre
data:
  SHARED_DATA_UID: {{ .Values.sgecore.env.sharedDataUid | quote }}
  SHARED_DATA_GID: {{ .Values.sgecore.env.sharedDataGid | quote }}
  SUBMITTER_HOSTNAME: {{ printf "dashboard-frontend.%s.svc.cluster.local" .Release.Namespace | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-sgecore
  labels:
    app.kubernetes.io/part-of: bsc-tre
spec:
  ports:
    - name: api
      port: {{ .Values.sgecore.service.port }}
      targetPort: {{ .Values.sgecore.service.port }}
      protocol: TCP
  selector:
    app: dashboard-sgecore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-sgecore
  labels:
    app.kubernetes.io/part-of: bsc-tre
spec:
  replicas: {{ .Values.sgecore.replicaCount }}
  selector:
    matchLabels:
      app: dashboard-sgecore
  template:
    metadata:
      labels:
        app: dashboard-sgecore
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: dashboard-init-create-shared-folders
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /shared_data/public /shared_data/userdata
              chmod -R 0777 /shared_data/public /shared_data/userdata || true
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: frontend-sgecore-shareddata
              mountPath: /shared_data
      containers:
        - name: dashboard-sgecore
          image: {{ .Values.images.sgecore.repository }}:{{ .Values.images.sgecore.tag }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: {{ .Values.sgecore.service.port }}
          command:
            - /bin/bash
            - -c
            - |
              groupmod -g $DOCKER_GROUP docker \
              && usermod -aG docker application \
              && echo "$SUBMITTER_HOSTNAME" > /home/application/submit_hosts.list \
              && /entrypoint.sh
          env:
            - name: DOCKER_GROUP
              value: {{ .Values.sgecore.dockerGroup | quote }}
          envFrom:
            - configMapRef:
                name: dashboard-sgecore-env
          resources:
            {{- toYaml .Values.sgecore.resources | nindent 12 }}
          volumeMounts:
            - name: frontend-sgecore-shareddata
              mountPath: /shared_data
      volumes:
        - name: frontend-sgecore-shareddata
          persistentVolumeClaim:
            claimName: dashboard-frontend-sgecore-shareddata
{{- end }}
