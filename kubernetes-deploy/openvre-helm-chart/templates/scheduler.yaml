{{- if .Values.scheduler.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/part-of: bsc-tre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/part-of: bsc-tre
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/part-of: bsc-tre
subjects:
  - kind: ServiceAccount
    name: scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scheduler
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.scheduler.authSecretName }}
  labels:
    app.kubernetes.io/part-of: bsc-tre
type: Opaque
stringData:
  {{ .Values.scheduler.authSecretKey }}: {{ .Values.scheduler.authToken | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app: scheduler
    app.kubernetes.io/part-of: bsc-tre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      serviceAccountName: scheduler
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: {{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}
          env:
            - name: DEFAULT_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SCHEDULER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scheduler.authSecretName }}
                  key: {{ .Values.scheduler.authSecretKey }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/part-of: bsc-tre
spec:
  selector:
    app: scheduler
  ports:
    - port: {{ .Values.scheduler.service.port }}
      targetPort: 8080
      protocol: TCP
{{- end }}
