# Block storage for Mongo / Postgres (one Cinder volume per PVC).
# WaitForFirstConsumer: volume is created in the AZ / node where the pod is pinned.
# Retain: deleting a PVC does not delete the OpenStack volume (safer for databases).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cinder-csi
provisioner: cinder.csi.openstack.org
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
