# OpenVRE batch tool run (tool launcher "kubernetes_native").
#
# Called by the OpenVRE frontend (ProcessK8s.php) for every non-interactive
# tool execution. The frontend writes a submission script into the run folder
# on the shared volume; this Job runs that script inside the tool's image.
#
# What the caller can choose: the parameters below, each checked against its type.
# What the caller cannot choose: user/group, volumes, node placement and security
# settings. Those come from this file or from the scheduler's own configuration
# ({{ config.* }}), and the scheduler's Job policy checks the result again.
#
# Rules for editing (see scheduler/README.md, "Templates"):
#   - Quote every placeholder: "{{ name }}".
#   - Quote values that must stay text, e.g. "1", "0640", "true".
#   - The scheduler refuses to start if this file is invalid.

name: openvre-batch-job
description: Run one OpenVRE tool execution as a Kubernetes Job.
kind: Job
name_param: job_name

parameters:
  job_name:
    type: name
    prefix: openvre-bj-
    required: true
    description: Job name, also used by OpenVRE as the job id. Generated by the frontend.
  image:
    type: image
    required: true
    description: Tool container image (infrastructure.container_image). Checked against OPENVRE_IMAGE_ALLOWLIST.
  workdir:
    type: path
    under: /shared_data
    required: true
    description: Run folder on the shared volume. The script starts here.
  submit_script:
    type: path
    under: /shared_data
    required: true
    description: Submission script written by the frontend.
  cpu:
    type: quantity
    default: "1"
    max: "8"
    description: CPU request and limit.
  memory_request:
    type: quantity
    default: "1Gi"
    max: "16Gi"
  memory_limit:
    type: quantity
    default: "2Gi"
    max: "16Gi"
  deadline_seconds:
    type: int
    default: 86400
    min: 60
    max: 604800
    description: Kill the Job after this many seconds.
  ttl_seconds:
    type: int
    default: 120
    min: 0
    max: 604800
    description: Delete the finished Job after this many seconds.
  env:
    type: env
    default: {}
    max_items: 50
    description: Extra environment variables from the tool definition (infrastructure.container_env).
  image_pull_secrets:
    type: pull_secrets
    default: []
    description: Extra registry secrets from the tool definition. Must be allowed on the scheduler.

manifest:
  apiVersion: batch/v1
  kind: Job
  metadata:
    name: "{{ job_name }}"
    labels:
      app.kubernetes.io/managed-by: openvre
      openvre-job-id: "{{ job_name }}"
  spec:
    ttlSecondsAfterFinished: "{{ ttl_seconds }}"
    activeDeadlineSeconds: "{{ deadline_seconds }}"
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/managed-by: openvre
          openvre-job-id: "{{ job_name }}"
          openvre.colocate: "true"
          # The batch NetworkPolicy selects this label: no ingress, no egress.
          openvre.io/batch: "true"
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        securityContext:
          runAsUser: "{{ config.run_as_uid }}"
          runAsGroup: "{{ config.run_as_gid }}"
          fsGroup: "{{ config.run_as_gid }}"
        nodeSelector: "{{ config.node_selector }}"
        tolerations: "{{ config.tolerations }}"
        imagePullSecrets: "{{ image_pull_secrets }}"
        containers:
          - name: tool-runner
            image: "{{ image }}"
            command: ["bash", "-lc", 'cd "$OPENVRE_WORKDIR" && bash "$OPENVRE_SUBMIT_SCRIPT"']
            env:
              # Tool variables first, so the two fixed ones below always win.
              - "{{ ...env }}"
              - name: OPENVRE_WORKDIR
                value: "{{ workdir }}"
              - name: OPENVRE_SUBMIT_SCRIPT
                value: "{{ submit_script }}"
            resources:
              requests:
                cpu: "{{ cpu }}"
                memory: "{{ memory_request }}"
              limits:
                cpu: "{{ cpu }}"
                memory: "{{ memory_limit }}"
            volumeMounts:
              - name: shared-data
                mountPath: "{{ config.shared_data_prefix }}"
        volumes:
          - name: shared-data
            persistentVolumeClaim:
              claimName: "{{ config.shared_pvc }}"
